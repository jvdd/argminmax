[package]
name = "argminmax"
version = "0.7.0"
authors = ["Jeroen Van Der Donckt"]
edition = "2021"
rust-version = "1.89"
readme = "README.md"
license = "MIT"
repository = "https://github.com/jvdd/argminmax"
description = "ArgMinMax (argmin & argmax in 1 function) with SIMD for floats and integers"
keywords = ["argminmax", "simd", "ndarray"]
categories = ["algorithms", "mathematics", "science"]
documentation = "https://docs.rs/argminmax"
exclude = [".git*", "dev_utils/**/*", "tests/**/*"]


[dependencies]
num-traits = { version = "0.2", default-features = false }
half = { version = "2.7", default-features = false, features=["num-traits"], optional = true }
ndarray = { version = "0.17", default-features = false, optional = true }
arrow = { version = ">0", default-features = false, optional = true }
# once_cell = "1.16.0"

[features]
default = ["float"]
nightly_simd = []
float = []
half = ["dep:half"]
ndarray = ["dep:ndarray"]
arrow = ["dep:arrow"]

[dev-dependencies]
half = { version = "2.7", default-features = false, features=["num-traits"] }
rstest = { version = "0.27", default-features = false }
rstest_reuse = { version = "0.7", default-features = false }
rand = { version = "0.10", default-features = false }
codspeed-criterion-compat = "5.0.2"
dev_utils = { path = "dev_utils" }


[[bench]]
name = "bench_f16_return_nan"
harness = false
required-features = ["half"]

[[bench]]
name = "bench_f16_ignore_nan"
harness = false
required-features = ["half"]

[[bench]]
name = "bench_f32_return_nan"
harness = false
required-features = ["float"]

[[bench]]
name = "bench_f32_ignore_nan"
harness = false
required-features = ["float"]

[[bench]]
name = "bench_f64_return_nan"
harness = false
required-features = ["float"]

[[bench]]
name = "bench_f64_ignore_nan"
harness = false
required-features = ["float"]

[[bench]]
name = "bench_i8"
harness = false

[[bench]]
name = "bench_i16"
harness = false

[[bench]]
name = "bench_i32"
harness = false

[[bench]]
name = "bench_i64"
harness = false

[[bench]]
name = "bench_u8"
harness = false

[[bench]]
name = "bench_u16"
harness = false

[[bench]]
name = "bench_u32"
harness = false

[[bench]]
name = "bench_u64"
harness = false

[[bench]]
name = "bench_masked"
harness = false
required-features = ["float"]
