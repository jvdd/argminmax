name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version
          cargo fmt --version
      
      - name: check no optional features
        run: cargo check --verbose
      - name: check with all features
        run: cargo check --verbose --all-features
      - name: check with formatting
        run: cargo fmt --all -- --check
      - name: check with clippy
        run: cargo clippy --all --all-targets --all-features -- -D warnings
      - name: check with clippy - no default features
        run: cargo clippy --all --lib --tests --no-default-features -- -D warnings
      # The SIMD code is cfg-gated per architecture, so clippy only lints it when
      # compiling for that architecture (x86_64 is linted above).
      # On armv7 we skip the benches, as these use the unstable is_arm_feature_detected!
      - name: Add the aarch64 and armv7 targets
        run: rustup target add aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf
      - name: check with clippy - aarch64 (NEON)
        run: cargo clippy --all --all-targets --all-features --target aarch64-unknown-linux-gnu -- -D warnings
      - name: check with clippy - armv7 (NEON with nightly_simd)
        run: cargo clippy --all --lib --tests --all-features --target armv7-unknown-linux-gnueabihf -- -D warnings
      - name: check with clippy - armv7 (no SIMD)
        run: cargo clippy --all --lib --tests --no-default-features --features "half,float" --target armv7-unknown-linux-gnueabihf -- -D warnings

  Check_Stable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macOS-latest']  # x86_64 and aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup override set stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check - default features
        run: cargo check
      - name: Run cargo check
        run: cargo check --no-default-features --features "half,float"

  Check_MSRV:
    runs-on: ubuntu-latest
    env:
      # There is no Cargo.lock, so select the dependency versions that support the MSRV
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust (rust-version from Cargo.toml)
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install $MSRV --profile minimal --no-self-update
          rustup override set $MSRV

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check - all features
        run: cargo check --all-features

  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macOS-latest', 'ubuntu-latest']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Run tests (debug) - no default features
        run: cargo test --verbose --no-default-features
      - name: Run tests (debug) - default features
        run: cargo test --verbose
      - name: Run tests (debug) - all features
        run: cargo test --verbose --all-features
      - name: Run tests (release) - all features
        run: cargo test --verbose --all-features --release

  Test_SDE:
    # Hosted runners do not always have AVX512, so we also run the tests on CPUs
    # emulated by the Intel Software Development Emulator (SDE)
    runs-on: ubuntu-latest
    env:
      SDE_DIR: sde-external-10.13.1-2026-07-28-lin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Intel SDE
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -O https://downloadmirror.intel.com/924984/$SDE_DIR.tar.xz
          echo "94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  $SDE_DIR.tar.xz" | sha256sum -c
          tar -xf $SDE_DIR.tar.xz
          # CPUID of Skylake-SP without AVX512BW, AVX512VL and AVX512DQ (leaf 7, EBX bits 30, 31 and 17)
          sed -E 's/^(00000007 00000000 => 00000000 )d39fffbf/\1139dffbf/' $SDE_DIR/misc/cpuid/skx/cpuid.def > avx512f-only.def
          grep -q '^00000007 00000000 => 00000000 139dffbf' avx512f-only.def
          echo "SDE=$PWD/$SDE_DIR/sde64" >> $GITHUB_ENV
          echo "AVX512F_ONLY_CPUID=$PWD/avx512f-only.def" >> $GITHUB_ENV

      - name: Run tests on Sapphire Rapids (AVX512)
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE -spr --" cargo test --release --features half
      - name: Run tests on a CPU with AVX512F but without AVX512BW
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE -cpuid_in $AVX512F_ONLY_CPUID -chip_check_cpuid 1 --" cargo test --release --features half

  Bench:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macOS-latest', 'ubuntu-latest']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Run benchmarks
        run: cargo bench --quiet --message-format=short  --all-features | grep "time:"
  
  Build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # We shouldn't really have any OS-specific code, so think of this as a list of architectures
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - i586-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          # MIPS is currently not supported anymore on nightly chains.
          # more information:
          #   - https://github.com/rust-lang/compiler-team/issues/648
          #   - https://github.com/rust-lang/rust/pull/113274
          # - mips-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - powerpc-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - sparc64-unknown-linux-gnu
          - wasm32-unknown-unknown

    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}

      # NOTE: `arrow` and `arrow2` are intentionally excluded from the wasm32
      # build. They pull in `ahash` -> `getrandom`, and getrandom >=0.3
      # deliberately fails to compile on `wasm32-unknown-unknown` unless the
      # final binary selects a randomness backend (e.g. via
      # `--cfg getrandom_backend="wasm_js"`). argminmax itself uses no
      # randomness, so this is a downstream/binary-level choice that a library
      # cannot (and should not) make. Apache Arrow on bare
      # `wasm32-unknown-unknown` is not a supported scenario, so we build every
      # argminmax-owned feature here except those two integrations.
      - name: Build (release) - all features
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo build --target ${{ matrix.target }} --release --all-features
      - name: Build (release) - all features (excl. arrow/arrow2 on wasm)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build --target ${{ matrix.target }} --release --features "half,ndarray"
      - name: Build (release) - default features
        run: cargo build --target ${{ matrix.target }} --release
      - name: Build (release) - no default features
        run: cargo build --target ${{ matrix.target }} --release --no-default-features
      - name: Build (release) - only float
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features float
      - name: Build (release) - only half
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features half
      - name: Build (release) - only float and half features
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features "half,float"


      - name: Override to stable toolchain
        run: |
          rustup override set stable
          rustup target add ${{ matrix.target }}
      - name: Build (release) - no default features
        run: cargo build --target ${{ matrix.target }} --release --no-default-features
      - name: Build (release) - only float
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features float
      - name: Build (release) - only half
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features half
      - name: Build (release) - only float and half features
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features "half,float"


      # - name: Run cargo-tarpaulin
      #   uses: actions-rs/tarpaulin@v0.1
      #   with:
      #     args: '--features half -- --test-threads 1'

      # - name: Upload to codecov.io
      #   uses: codecov/codecov-action@v3


# largely inspired by: https://github.com/rust-lang/portable-simd/blob/master/.github/workflows/ci.yml
